<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best of World</title>
<link rel="icon" type="image/webp" href="logo.webp">
<style>
html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    background:#000;
    overflow:hidden;
}
body{
    display:flex;
    align-items:center;
    justify-content:center;
}
#rick-video{
    width:100vw;
    height:100vh;
    display:block;
    object-fit:contain;
    background:#000;
}
#loading{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#fff;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:16px;
    letter-spacing:.3px;
    transition:opacity .25s ease;
    pointer-events:none;
}
#loading.hidden{opacity:0;}
#play-fallback{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:20;
    display:none;
    border:1px solid rgba(255,255,255,.45);
    border-radius:6px;
    padding:10px 18px;
    background:rgba(25,25,25,.9);
    color:#fff;
    font:15px "Segoe UI",Arial,sans-serif;
    cursor:pointer;
}
#play-fallback.show{display:block;}
</style>
</head>
<body>
<video id="rick-video" preload="auto" autoplay playsinline controlslist="nodownload noplaybackrate">
    <source src="bestofworld.mp4" type="video/mp4">
    您的浏览器不支持 HTML5 视频播放。
</video>
<div id="loading">正在准备体验……</div>
<button id="play-fallback" type="button">✨ 点我开启新世界！</button>

<script>
(function(){
    var video=document.getElementById("rick-video");
    var loading=document.getElementById("loading");
    var fallback=document.getElementById("play-fallback");

    function hideLoading(){
        loading.className="hidden";
    }

    function enterFullscreen(){
        var fn=video.requestFullscreen||video.webkitRequestFullscreen||video.msRequestFullscreen;
        if(fn){
            try{
                var result=fn.call(video);
                if(result&&result.catch){result.catch(function(){});}
            }catch(e){}
        }
    }

    function startPlayback(){
        try{
            var promise=video.play();
            if(promise&&promise.catch){
                promise.catch(function(){
                    fallback.className="show";
                });
            }
        }catch(e){
            fallback.className="show";
        }
    }

    video.addEventListener("loadeddata",function(){
        hideLoading();
        startPlayback();
    });

    video.addEventListener("canplay",function(){
        hideLoading();
        startPlayback();
    });

    video.addEventListener("playing",function(){
        fallback.className="";
        hideLoading();
        enterFullscreen();
    });

    fallback.addEventListener("click",function(){
        fallback.className="";
        startPlayback();
    });

    startPlayback();
})();
</script>
</body>
</html>
